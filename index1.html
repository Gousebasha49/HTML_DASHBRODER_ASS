<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eee;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            background: #131921;
            color: white;
            padding: 20px;
        }

        /* FLEX CONTAINER */
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        /* FLEX ITEMS */
        .product {
            width: 250px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: contain;
        }

        .product h2 {
            margin: 10px 0;
            font-size: 18px;
        }

        .product p {
            font-size: 20px;
            font-weight: bold;
            color: #b12704;
        }

        .product button {
            margin-top: 15px;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background: #ffd814;
            cursor: pointer;
            font-weight: bold;
        }

        .product button:hover {
            background: #f7ca00;
        }
    </style>
</head>
<body>

    <h1>Amazon Products</h1>

    <div class="products">

        <div class="product">
            <img src="https://tse2.mm.bing.net/th/id/OIP.RR04JVLoZVCIyZtqeus_xAHaEK?r=0&pid=Api&h=220&P=0" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>₹15,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://tse3.mm.bing.net/th/id/OIP.bnlL6P421FsQrEN7l7Li4gHaFk?r=0&pid=Api&h=220&P=0" alt="Laptop">
            <h2>Laptop</h2>
            <p>₹45,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://tse3.mm.bing.net/th/id/OIP.0ZFa9iKjVIm3Yvp9JmcwMQHaEl?r=0&pid=Api&h=220&P=0" alt="Headphones">
            <h2>Headphones</h2>
            <p>₹1,499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://tse2.mm.bing.net/th/id/OIP.XincheCxdxdwSJr5Bh4idgHaHa?r=0&pid=Api&h=220&P=0" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>₹2,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://i5.walmartimages.com/seo/Santimon-Black-Dress-Shoes-for-Men-Pointed-Toe-Lace-up-Derby-Shoes-Cowhide-Leather-Formal-Shoes-US-8_7c63937c-77c7-447f-997a-82c363c591df.6c6f193c765177d99e07d8b19b372e27.jpeg" alt="Shoes">
            <h2>Shoes</h2>
            <p>₹1,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://tse4.mm.bing.net/th/id/OIP.PG-c-ujlENwOdCuLNN4UaQHaGp?r=0&pid=Api&h=220&P=0" alt="Backpack">
            <h2>Backpack</h2>
            <p>₹999</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
